# Run from observability/prometheus (see README). 1 sample per minute; 1 request per second = 60 per minute.
rule_files:
  - ../rules/slo.yml

evaluation_interval: 1m

tests:
  # Healthy for 7h: 0% errors => no alert.
  - name: healthy traffic fires nothing
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="200"}'
        values: '0+60x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: OrderAvailabilitySlowBurn
        exp_alerts: []

  # Failures begin 80 minutes before the end: 20% bad => burn 20 on both the 1h and 5m windows => page.
  # The 6h window only averages 4.4% (burn 4.4 < 6), so the slow-burn ticket does not fire.
  - name: sudden outage fires the fast burn only
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="200"}'
        values: '0+48x420'
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="500"}'
        values: '0+0x340 0+12x80'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: order_availability
            exp_annotations:
              summary: "Order availability: burning the 7d error budget 20x too fast (1h and 5m windows)"
      - eval_time: 7h
        alertname: OrderAvailabilitySlowBurn
        exp_alerts: []

  # A short blip: bad for 10 minutes only. The 5m window burns hard, but the 1h window does not => no page.
  - name: short blip does not page
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="200"}'
        values: '0+48x420'
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="500"}'
        values: '0+0x410 0+12x10'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderAvailabilityFastBurn
        exp_alerts: []

  # Steady 7% errors for the whole time: burn 7 on 6h and 30m (> 6) => ticket; below 14 => no page.
  - name: steady leak fires the slow burn only
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="200"}'
        values: '0+55.8x420'
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="500"}'
        values: '0+4.2x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderAvailabilityFastBurn
        exp_alerts: []
      - eval_time: 7h
        alertname: OrderAvailabilitySlowBurn
        exp_alerts:
          - exp_labels:
              severity: warning
              slo: order_availability
            exp_annotations:
              summary: "Order availability: burning the 7d error budget 7x too fast (6h and 30m windows)"

  # Failsafe rejections are HTTP 422 (not 5xx) but count against availability: 20% of orders failsafe-rejected.
  - name: failsafe rejects burn the availability budget
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="422"}'
        values: '0+60x420'
      - series: 'orders_placed_total{job="orderservice", outcome="failsafe"}'
        values: '0+0x340 0+12x80'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: order_availability
            exp_annotations:
              summary: "Order availability: burning the 7d error budget 20x too fast (1h and 5m windows)"

  # Too few requests: 1 request every 10 minutes, all failing. 100% bad, but below the volume guard.
  - name: tiny traffic is below the volume guard
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="500"}'
        values: '0+0.1x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderAvailabilityFastBurn
        exp_alerts: []

  # Latency: the 0.8 s bucket is cumulative, so "good" = bucket{le="0.8"}. 20% of orders slower than 0.8 s for the last 80 min.
  - name: slow orders fire the latency fast burn
    interval: 1m
    input_series:
      - series: 'orders_place_latency_seconds_count{job="orderservice", outcome="accepted"}'
        values: '0+60x420'
      - series: 'orders_place_latency_seconds_bucket{job="orderservice", outcome="accepted", le="0.8"}'
        values: '0+60x340 20400+48x80'
      - series: 'http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status="200"}'
        values: '0+60x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: OrderLatencyFastBurn
        exp_alerts:
          - exp_labels:
              severity: critical
              slo: order_latency
            exp_annotations:
              summary: "Order latency (>800 ms): burning the 7d error budget 20x too fast (1h and 5m windows)"
