    metrics_path: /actuator/prometheus   # Spring Boot's path, not the default /metrics
    static_configs:
      - targets: ["host.docker.internal:8085"]
        labels:
          service: advisor
    metric_relabel_configs:
      - source_labels: [uri]
        regex: /actuator.*
