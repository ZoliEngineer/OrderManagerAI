# Rules evaluated everywhere (local and AWS). Tested by tests/ordermanager.test.yml.
groups:
  # Recording rules: compute an expensive or reused expression once, store it as a new series.
  # Naming convention: level:metric:operations (here: per job, HTTP requests, 5m rate).
  - name: ordermanager-recording
    rules:
      - record: job:http_server_requests:rate5m
        expr: sum by (job) (rate(http_server_requests_seconds_count[5m]))
      - record: job:http_server_errors:rate5m
        expr: sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
      - record: job:http_server_errors:ratio5m
        expr: job:http_server_errors:rate5m / job:http_server_requests:rate5m

  - name: ordermanager-alerts
    rules:
      # `and ... > 0.1` is the minimum-volume guard: below ~30 requests per 5 minutes one failure
      # is 50% and would page for nothing. A ratio alone is meaningless without volume.
      # The "is it up" alert: Prometheus could not scrape the service's /actuator/prometheus.
      # Risk is scraped on its actuator port (8083); its failures also show up as RiskFailSafeRejects on the order side.
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not being scraped (down, or wrong port)"

      - alert: HighErrorRate
        expr: job:http_server_errors:ratio5m > 0.05 and job:http_server_requests:rate5m > 0.1
        for: 5m          # must hold for 5 minutes (pending -> firing), so a blip does not alert
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of requests fail with 5xx"

      # Order service could not get a risk answer (down, or slower than the 800 ms deadline).
      - alert: RiskFailSafeRejects
        expr: sum(rate(orders_placed_total{outcome="failsafe"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Orders are being rejected because the risk service is unavailable or too slow"

      # Ring buffer has 65,536 slots; 13,107 is 20% free. Nearly full means the matching thread lags.
      - alert: RingBufferPressure
        expr: execution_ringbuffer_remaining < 13107
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Execution ring buffer has only {{ $value }} free slots"

      # No ticks for 5 minutes while the service is up. With the live Finnhub feed this also fires
      # when the US market is closed: a known false positive until it is gated on market status.
      - alert: StalePrices
        expr: increase(marketdata_ticks_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Market data has received no price ticks for 10 minutes"
