# SLO rules. Objective 99% => error budget 1% (0.01): the burn rate is the bad ratio divided by 0.01.
# Burn rate 1 = spending the budget exactly as fast as the 7-day window allows; 14 = the whole 7d budget gone in 12 hours.
# Multi-window rule: an alert needs a LONG window (it is a real, sustained burn) AND a SHORT window (it is still happening now).
# Tested by tests/slo.test.yml. Latency threshold 0.8 s = the risk call deadline, and must be an exact histogram bucket
# (orderservice registers it with serviceLevelObjectives(800ms)).
groups:
  - name: slo-order-availability
    rules:
      # Minimum-volume guard for the alerts (about 18 requests per hour).
      - record: slo:order_requests:rate1h
        expr: sum(rate(http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders"}[1h]))
      - record: slo:order_availability:bad_ratio_rate5m
        expr: >-
          (
            (sum(rate(http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status=~"5.."}[5m])) or vector(0))
            +
            (sum(rate(orders_placed_total{job="orderservice", outcome="failsafe"}[5m])) or vector(0))
          )
          / sum(rate(http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders"}[5m]))
      - record: slo:order_availability:burnrate5m
        expr: slo:order_availability:bad_ratio_rate5m / 0.01
      - record: slo:order_availability:bad_ratio_rate30m
        expr: >-
          (
            (sum(rate(http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status=~"5.."}[30m])) or vector(0))
            +
            (sum(rate(orders_placed_total{job="orderservice", outcome="failsafe"}[30m])) or vector(0))
          )
          / sum(rate(http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders"}[30m]))
      - record: slo:order_availability:burnrate30m
        expr: slo:order_availability:bad_ratio_rate30m / 0.01
      - record: slo:order_availability:bad_ratio_rate1h
        expr: >-
          (
            (sum(rate(http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status=~"5.."}[1h])) or vector(0))
            +
            (sum(rate(orders_placed_total{job="orderservice", outcome="failsafe"}[1h])) or vector(0))
          )
          / sum(rate(http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders"}[1h]))
      - record: slo:order_availability:burnrate1h
        expr: slo:order_availability:bad_ratio_rate1h / 0.01
      - record: slo:order_availability:bad_ratio_rate6h
        expr: >-
          (
            (sum(rate(http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders", status=~"5.."}[6h])) or vector(0))
            +
            (sum(rate(orders_placed_total{job="orderservice", outcome="failsafe"}[6h])) or vector(0))
          )
          / sum(rate(http_server_requests_seconds_count{job="orderservice", method="POST", uri="/api/orders"}[6h]))
      - record: slo:order_availability:burnrate6h
        expr: slo:order_availability:bad_ratio_rate6h / 0.01

  - name: slo-order-latency
    rules:
      - record: slo:order_latency:bad_ratio_rate5m
        expr: >-
          1 - sum(rate(orders_place_latency_seconds_bucket{job="orderservice", le="0.8"}[5m]))
          / sum(rate(orders_place_latency_seconds_count{job="orderservice"}[5m]))
      - record: slo:order_latency:burnrate5m
        expr: slo:order_latency:bad_ratio_rate5m / 0.01
      - record: slo:order_latency:bad_ratio_rate30m
        expr: >-
          1 - sum(rate(orders_place_latency_seconds_bucket{job="orderservice", le="0.8"}[30m]))
          / sum(rate(orders_place_latency_seconds_count{job="orderservice"}[30m]))
      - record: slo:order_latency:burnrate30m
        expr: slo:order_latency:bad_ratio_rate30m / 0.01
      - record: slo:order_latency:bad_ratio_rate1h
        expr: >-
          1 - sum(rate(orders_place_latency_seconds_bucket{job="orderservice", le="0.8"}[1h]))
          / sum(rate(orders_place_latency_seconds_count{job="orderservice"}[1h]))
      - record: slo:order_latency:burnrate1h
        expr: slo:order_latency:bad_ratio_rate1h / 0.01
      - record: slo:order_latency:bad_ratio_rate6h
        expr: >-
          1 - sum(rate(orders_place_latency_seconds_bucket{job="orderservice", le="0.8"}[6h]))
          / sum(rate(orders_place_latency_seconds_count{job="orderservice"}[6h]))
      - record: slo:order_latency:burnrate6h
        expr: slo:order_latency:bad_ratio_rate6h / 0.01

  - name: slo-alerts
    rules:
      - alert: OrderAvailabilityFastBurn
        expr: slo:order_availability:burnrate1h > 14 and slo:order_availability:burnrate5m > 14 and slo:order_requests:rate1h > 0.005
        for: 2m
        labels:
          severity: critical     # page: the 7-day budget would be gone in about 12 hours
          slo: order_availability
        annotations:
          summary: "Order availability: burning the 7d error budget {{ $value | printf \"%.0f\" }}x too fast (1h and 5m windows)"
      - alert: OrderAvailabilitySlowBurn
        expr: slo:order_availability:burnrate6h > 6 and slo:order_availability:burnrate30m > 6 and slo:order_requests:rate1h > 0.005
        for: 15m
        labels:
          severity: warning      # ticket: the budget would be gone in about 1 day
          slo: order_availability
        annotations:
          summary: "Order availability: burning the 7d error budget {{ $value | printf \"%.0f\" }}x too fast (6h and 30m windows)"
      - alert: OrderLatencyFastBurn
        expr: slo:order_latency:burnrate1h > 14 and slo:order_latency:burnrate5m > 14 and slo:order_requests:rate1h > 0.005
        for: 2m
        labels:
          severity: critical     # page: the 7-day budget would be gone in about 12 hours
          slo: order_latency
        annotations:
          summary: "Order latency (>800 ms): burning the 7d error budget {{ $value | printf \"%.0f\" }}x too fast (1h and 5m windows)"
      - alert: OrderLatencySlowBurn
        expr: slo:order_latency:burnrate6h > 6 and slo:order_latency:burnrate30m > 6 and slo:order_requests:rate1h > 0.005
        for: 15m
        labels:
          severity: warning      # ticket: the budget would be gone in about 1 day
          slo: order_latency
        annotations:
          summary: "Order latency (>800 ms): burning the 7d error budget {{ $value | printf \"%.0f\" }}x too fast (6h and 30m windows)"
