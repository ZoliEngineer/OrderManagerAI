# Local stack only (not deployed to Azure). Locally services are started by hand, so a down target is
# expected and worth a visible alert. In Azure, container health is Azure's job and risk is not scraped at all.
groups:
  - name: ordermanager-local
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not being scraped (down, or wrong port)"
