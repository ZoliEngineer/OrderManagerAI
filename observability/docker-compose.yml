# Local observability stack. Grows one component per roadmap step (docs/observability.md).
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: om-prometheus
    ports:
      # Host 9091, because riskservice's gRPC server already owns 9090 locally.
      - "9091:9090"
    # OTLP receiver: apps push metrics via the Collector (step 14). native-histograms: store exponential histograms natively.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # Lets the container reach services running on the host (mvn spring-boot:run).
    # Docker Desktop provides host.docker.internal itself; on Linux this line adds it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: om-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager    # silences survive restarts
    depends_on:
      - mailpit

  # Fake SMTP server with a web inbox: every email Alertmanager sends lands here, none leave the machine.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: om-mailpit
    ports:
      - "8025:8025"     # web UI
      # SMTP (1025) is only reachable inside the compose network

  # Receives OTLP spans from the apps (host :4318) and forwards them to Tempo.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    container_name: om-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4318:4318"     # OTLP/HTTP, used by the apps
      - "4317:4317"     # OTLP/gRPC
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
      - loki
      - prometheus

  # Log storage and query API (LogQL). Receives OTLP logs from the Collector.
  loki:
    image: grafana/loki:3.5.3
    container_name: om-loki
    user: root          # local volume write access
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ./loki/rules:/loki/rules:ro      # ruler: NewErrorLogs
      - loki-data:/loki

  # Trace storage (local disk) and query API.
  tempo:
    image: grafana/tempo:2.8.2
    container_name: om-tempo
    user: root          # local volume write access
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.1.0
    container_name: om-grafana
    ports:
      - "3001:3000"            # host 3001: the React dev server owns 3000
    environment:
      # Local-only convenience: no login screen. Never do this in a shared environment.
      TEMPO_URL: http://tempo:3200
      LOKI_URL: http://loki:3100
      PROMETHEUS_URL: http://prometheus:9090   # compose service name + container port (not host 9091)
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # data source + dashboard provider, read at startup
      - ./grafana/dashboards:/etc/grafana/dashboards:ro   # the dashboard JSON files
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  tempo-data:
  loki-data:
