# Loki ruler rules (same format as Prometheus). Tenant dir "fake" = the tenant when auth_enabled is false.
groups:
  - name: ordermanager-logs
    rules:
      # ERROR means an engineer must fix something (docs/observability.md, log-level rules).
      # Warning severity: goes to the digest, not a page. detected_level is added by Loki to OTLP logs.
      - alert: NewErrorLogs
        expr: sum by (service_name) (count_over_time({service_name=~"ordermanager-.+"} | detected_level="error" [5m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }} logged ERROR records in the last 5 minutes"
