name: Deploy to AWS

# Builds every service, pushes images to ECR, uploads the frontend to S3/CloudFront and rolls the ECS services.
# Infrastructure (terraform/) is applied manually, not from this workflow.
#
# Required repository variables (Settings → Secrets and variables → Actions → Variables); values come from
# `terraform output`:
#   AWS_DEPLOY_ROLE_ARN          github_deploy_role_arn
#   FRONTEND_BUCKET              frontend_bucket
#   CLOUDFRONT_DISTRIBUTION_ID   cloudfront_distribution_id
# Optional: AWS_REGION (default us-east-1), ECS_CLUSTER (default ordermanagerai-prod).

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC → AWS, no stored credentials
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'ordermanagerai-prod' }}
  PREFIX: ordermanagerai

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: marketdata,       name: marketdata }
          - { dir: accountservice,   name: account }
          - { dir: orderservice,     name: order }
          - { dir: riskservice,      name: risk }
          - { dir: executionservice, name: execution }
          - { dir: mcpservice,       name: mcp }
          - { dir: advisorservice,   name: advisor }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: cd ${{ matrix.dir }} && mvn clean package -DskipTests -B

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Registry is the only cloud-specific input; the Dockerfiles are cloud-neutral.
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/${PREFIX}-${{ matrix.name }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" ${{ matrix.dir }}/
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  frontend:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # No environment-specific values at build time: the app reads /config.json (written by Terraform) at runtime.
      - name: Build
        run: cd frontend && npm ci && npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          BUCKET="${{ vars.FRONTEND_BUCKET }}"
          # config.json is owned by Terraform: never upload or delete it here.
          aws s3 sync frontend/build "s3://$BUCKET" --delete \
            --exclude config.json --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend/build/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache" --content-type text/html

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html" "/"

  deploy:
    needs: [images, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Task definitions point at :latest, so a forced deployment pulls the image pushed above.
      # Services scaled to 0 (env-down) just pick the new image up on the next env-up.
      - name: Roll ECS services
        run: |
          for svc in marketdata account order risk execution mcp advisor; do
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "${PREFIX}-prod-${svc}" \
              --force-new-deployment --query 'service.serviceName' --output text
          done

      - name: Wait for stability and check running counts
        run: |
          SERVICES=""
          for svc in marketdata account order risk execution mcp advisor; do SERVICES="$SERVICES ${PREFIX}-prod-${svc}"; done
          # Waits in batches of 10 (we have 7); returns immediately for services with desiredCount 0.
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services $SERVICES
          FAILED=0
          for s in $SERVICES; do
            read -r DESIRED RUNNING < <(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$s" \
              --query 'services[0].[desiredCount,runningCount]' --output text)
            if [ "$RUNNING" -lt "$DESIRED" ]; then
              echo "❌ $s: $RUNNING/$DESIRED running"; FAILED=1
            elif [ "$DESIRED" -eq 0 ]; then
              echo "ℹ️ $s: scaled to 0 (environment is down)"
            else
              echo "✅ $s: $RUNNING/$DESIRED running"
            fi
          done
          exit $FAILED
