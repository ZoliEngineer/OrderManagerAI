# .github/workflows/anthropic-wif-test.yml
name: anthropic-wif-test
on: push
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_019B3A9Hj6iTF6QbBBwDxifq",
            "organization_id": "6c6acfa5-87c1-4562-866a-18469b92d337",
            "service_account_id": "svac_01GCkWV82tnjnU1Uqb9BGX6S",
            "workspace_id": "wrkspc_01WhzLkaAhug6ycJpTwM9RMk"
          }
          JSON
