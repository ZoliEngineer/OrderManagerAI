spring.application.name=ordermanager-mcp
spring.config.import=optional:file:../.env[.properties]
server.port=8084

# MCP server (Streamable HTTP at /mcp)
spring.ai.mcp.server.name=ordermanager-mcp
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=OrderManagerAI trading tools. Use get_market_prices to read current prices, place_order to submit BUY/SELL orders for an advisor's trade account, and cancel_order to cancel an open order.

# Downstream services (the caller's bearer token is forwarded)
mcp.downstream.order-service-url=${ORDER_SERVICE_URL:http://localhost:8082}
mcp.downstream.market-data-url=${MARKETDATA_URL:http://localhost:8080}
mcp.downstream.connect-timeout=2s
mcp.downstream.order-read-timeout=3s
mcp.downstream.market-data-read-timeout=2s

# Guardrails for agent-initiated orders (remove a property to disable that check)
mcp.trading.max-quantity-per-order=${MCP_MAX_QUANTITY_PER_ORDER:1000}
mcp.trading.max-notional-per-order=${MCP_MAX_NOTIONAL_PER_ORDER:50000}

# Security — Entra ID (Azure AD); /mcp additionally requires the mcp.trade scope
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AAD_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${AAD_CLIENT_ID}

# OAuth 2.0 Protected Resource Metadata (RFC 9728) for MCP client discovery
mcp.oauth.resource=${MCP_PUBLIC_URL:http://localhost:8084}
mcp.oauth.authorization-servers=https://login.microsoftonline.com/${AAD_TENANT_ID}/v2.0
mcp.oauth.scopes-supported=api://${AAD_CLIENT_ID}/mcp.trade

# Actuator
management.endpoints.web.exposure.include=health
