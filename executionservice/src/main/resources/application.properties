spring.application.name=ordermanager-execution
spring.config.import=optional:file:../.env[.properties]

# HTTP exists only for actuator (metrics scrape); the engine itself is Kafka-driven
server.port=8086
management.endpoints.web.exposure.include=health,prometheus
# Added to every meter so series can be told apart by service
management.metrics.tags.application=${spring.application.name}

# Kafka
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.bootstrap-servers=pkc-56d1g.eastus.azure.confluent.cloud:9092
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_CLUSTER_API_KEY}" password="${KAFKA_CLUSTER_API_SECRET}";
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.client.dns.lookup=use_all_dns_ips
spring.kafka.properties.session.timeout.ms=45000

spring.kafka.consumer.group-id=executionservice
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

app.kafka.topic.order-created=order.created
app.kafka.topic.execution-report=execution.report

app.kafka.consumer-group.order-events=execution-order-events
app.kafka.consumer-group.marketdata=execution-marketdata

# Tracing (OpenTelemetry): spans go via OTLP/HTTP to the Collector (observability/docker-compose.yml)
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.service.namespace=ordermanager
management.tracing.sampling.probability=1.0
# Metrics: pushed via OTLP/HTTP (exponential histograms, cumulative) next to the Prometheus pull path, so the two can be compared (step 14)
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=30s
management.otlp.metrics.export.aggregation-temporality=cumulative
management.otlp.metrics.export.histogram-flavor=base2-exponential-bucket-histogram
# Kafka consumer spans continue the trace from the record's traceparent header
spring.kafka.listener.observation-enabled=true

# Logs (OpenTelemetry): records go via OTLP/HTTP to the Collector, then to Loki
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
