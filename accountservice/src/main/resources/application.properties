server.port=8081

spring.config.import=optional:file:../.env[.properties]

spring.application.name=ordermanager-account

# Flyway owns schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway — enabled only when FLYWAY_ENABLED=true (local dev only)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.flyway.user=ordermanager_user.hojmlgojciudwfwflpoz
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}


# PostgreSQL (Supabase)
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=ordermanager_user.hojmlgojciudwfwflpoz
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# Redis — same instance as marketdata
spring.data.redis.host=${REDIS_HOST:redis-10771.c56.east-us.azure.cloud.redislabs.com}
spring.data.redis.port=${REDIS_PORT:10771}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=false
app.cache.buying-power.key-prefix=account:buying-power:
app.cache.buying-power.ttl-hours=24

# OIDC resource server (Cognito, Entra ID or any OIDC provider)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://cognito-idp.us-east-2.amazonaws.com/us-east-2_TaQOwpmkA}
app.security.allowed-client-ids=${OIDC_CLIENT_IDS:17687au1t7n5f4sou3krgjbjak,53b2dun8mj4aavpu75igpuj25c}

cors.allowed-origins=http://localhost:3000

management.endpoints.web.exposure.include=health,prometheus
# /actuator/health lists each dependency (db, redis, ...) with its UP/DOWN status, but no connection details
management.endpoint.health.show-components=always
# Finish in-flight requests on SIGTERM (scale-down, deploys); Container Apps allows 30 s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Added to every meter so series can be told apart by service
management.metrics.tags.application=${spring.application.name}
