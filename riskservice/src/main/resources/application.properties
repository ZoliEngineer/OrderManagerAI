server.port=8083
spring.application.name=ordermanager-risk
spring.config.import=optional:file:../.env[.properties]

# gRPC (wired in step 3 when grpc-server-spring-boot-starter is added)
grpc.server.port=9090
grpc.server.security.enabled=false

# Redis (buying-power cache only)
spring.data.redis.host=${REDIS_HOST:redis-10771.c56.east-us.azure.cloud.redislabs.com}
spring.data.redis.port=${REDIS_PORT:10771}
spring.data.redis.password=${REDIS_PASSWORD}
app.cache.buying-power.key-prefix=account:buying-power:

# Kafka (market price feed)
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.bootstrap-servers=pkc-56d1g.eastus.azure.confluent.cloud:9092
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_CLUSTER_API_KEY}" password="${KAFKA_CLUSTER_API_SECRET}";
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.client-id=ccloud-springboot-client-aab84004-0f56-4571-95a1-919ca23f9601
spring.kafka.properties.client.dns.lookup=use_all_dns_ips
spring.kafka.properties.session.timeout.ms=45000
spring.kafka.consumer.group-id=riskservice-price-cache
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=latest
app.kafka.topic.marketdata=marketdata_stream

# OIDC resource server (Cognito, Entra ID or any OIDC provider)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://cognito-idp.us-east-2.amazonaws.com/us-east-2_TaQOwpmkA}
app.security.allowed-client-ids=${OIDC_CLIENT_IDS:17687au1t7n5f4sou3krgjbjak,53b2dun8mj4aavpu75igpuj25c}

management.endpoints.web.exposure.include=health,prometheus
# /actuator/health lists each dependency (db, redis, ...) with its UP/DOWN status, but no connection details
management.endpoint.health.show-components=always
# Liveness/readiness groups: ECS health checks use /actuator/health/liveness so a down dependency (Redis, DB, Kafka)
# does not get the task killed and restarted in a loop
management.endpoint.health.probes.enabled=true
# Finish in-flight requests on SIGTERM (scale-down, deploys); Container Apps allows 30 s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Added to every meter so series can be told apart by service
management.metrics.tags.application=${spring.application.name}

