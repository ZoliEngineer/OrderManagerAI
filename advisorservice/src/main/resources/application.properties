spring.application.name=ordermanager-advisor
spring.config.import=optional:file:../.env[.properties]
server.port=8085
# Served under /advisor so the same CloudFront host can route / (SPA), /api (backends) and /advisor (this service)
server.servlet.context-path=/advisor
spring.threads.virtual.enabled=true
# SSE streams for one advisor turn (web searches + tool calls) can take minutes
spring.mvc.async.request-timeout=10m

# Claude
advisor.anthropic-api-key=${ANTHROPIC_API_KEY:}
# Experimental feature: Sonnet 5.5 at low effort is the cheapest model that supports web_search_20260209 and the
# "default" refusal fallback. Cheaper still: ADVISOR_MODEL=claude-haiku-5-5 with both of those switched off.
# Deeper analysis: ADVISOR_MODEL=claude-opus-5-5, ADVISOR_EFFORT=high.
advisor.model=${ADVISOR_MODEL:claude-sonnet-5-5}
advisor.effort=${ADVISOR_EFFORT:low}
advisor.max-tokens=64000
advisor.max-web-searches-per-turn=5
# web_search_20260209 (dynamic filtering) needs Opus/Sonnet 4.6+; set false for Haiku (basic web_search_20250305)
advisor.web-search-dynamic-filtering=${ADVISOR_WEB_SEARCH_DYNAMIC_FILTERING:true}
advisor.max-tool-iterations=20
# Server-side refusal fallback (beta) — routes a declined request to a fallback model. Claude API only; not available for Haiku.
advisor.refusal-fallback=${ADVISOR_REFUSAL_FALLBACK:true}

# Human-in-the-loop
advisor.approval-ttl=10m
advisor.conversation-idle-ttl=2h

# MCP server with the trading tools (the user's bearer token is forwarded)
advisor.mcp-url=${MCP_SERVER_URL:http://localhost:8084/mcp}
advisor.mcp-request-timeout=15s
advisor.tool-list-cache-ttl=5m

# Values the static chat page needs for OIDC sign-in (served at /config.json)
advisor.ui.authority=${OIDC_ISSUER_URI:https://cognito-idp.us-east-2.amazonaws.com/us-east-2_TaQOwpmkA}
advisor.ui.client-id=${OIDC_UI_CLIENT_ID:53b2dun8mj4aavpu75igpuj25c}
advisor.ui.scope=openid ${MCP_SCOPE:ordermanager/mcp.trade}
# Optional IdP logout URL (Cognito: https://<domain>/logout?client_id=...&logout_uri=...)
advisor.ui.logout-url=${OIDC_LOGOUT_URL:}

# OIDC resource server (Cognito, Entra ID or any OIDC provider) — /api/** additionally requires the mcp.trade scope
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://cognito-idp.us-east-2.amazonaws.com/us-east-2_TaQOwpmkA}
app.security.allowed-client-ids=${OIDC_CLIENT_IDS:17687au1t7n5f4sou3krgjbjak,53b2dun8mj4aavpu75igpuj25c}

# Actuator
management.endpoints.web.exposure.include=health,prometheus
# /actuator/health lists each dependency (db, redis, ...) with its UP/DOWN status, but no connection details
management.endpoint.health.show-components=always
# Finish in-flight requests on SIGTERM (scale-down, deploys); Container Apps allows 30 s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# Added to every meter so series can be told apart by service
management.metrics.tags.application=${spring.application.name}

